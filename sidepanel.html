<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Operation Recorder</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="app" class="app-shell">
    <section id="homeView" class="view view-home">
      <header class="home-header">
        <div>
          <p class="eyebrow">Automation Hub</p>
          <h1 class="home-title">自动化功能</h1>
          <p class="home-subtitle">从首页选择功能，再进入对应的二级页面操作。</p>
        </div>
      </header>

      <div class="feature-grid">
        <button id="openRecorderCard" class="feature-card feature-card-recorder" type="button">
          <span class="feature-card-badge">已接入</span>
          <div class="feature-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="5" width="16" height="14" rx="3"></rect>
              <circle cx="9" cy="12" r="2.5" fill="currentColor" stroke="none"></circle>
              <path d="M14 9.5h4M14 12h4M14 14.5h3"></path>
            </svg>
          </div>
          <div class="feature-card-body">
            <h2>录制自动化操作</h2>
            <p>录制浏览器中的点击、输入、悬停和按键，再回放整段自动化流程。</p>
          </div>
          <div class="feature-card-meta">
            <span id="homeOperationCount" class="feature-metric">0 个步骤</span>
            <span class="feature-link">进入</span>
          </div>
        </button>
      </div>
    </section>

    <section id="recorderView" class="view view-recorder hidden">
      <header class="header">
        <div class="header-main">
          <button id="btnBackHome" class="btn-back" type="button" aria-label="返回首页">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 18l-6-6 6-6"></path>
            </svg>
          </button>
          <div>
            <p class="eyebrow">Automation</p>
            <h1 class="title">录制自动化操作</h1>
          </div>
        </div>
        <div id="recordingStatus" class="status-indicator status-idle">
          <span class="status-dot"></span>
          <span id="statusText" class="status-text">未录制</span>
        </div>
      </header>

      <section class="controls">
        <button id="btnRecord" class="btn btn-primary">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="6"></circle>
            </svg>
          </span>
          <span>开始录制</span>
        </button>
        <button id="btnPause" class="btn btn-warning" disabled>
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <rect x="7" y="5" width="4" height="14" rx="1"></rect>
              <rect x="13" y="5" width="4" height="14" rx="1"></rect>
            </svg>
          </span>
          <span>暂停</span>
        </button>
        <button id="btnStop" class="btn btn-danger" disabled>
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"></rect>
            </svg>
          </span>
          <span>停止</span>
        </button>
        <button id="btnClear" class="btn btn-secondary" disabled>
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v5M14 11v5"></path>
            </svg>
          </span>
          <span>清空</span>
        </button>
      </section>

      <section class="stats">
        <div class="stat-item">
          <span class="stat-label">操作数量</span>
          <span id="operationCount" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">录制时长</span>
          <span id="recordingDuration" class="stat-value">00:00</span>
        </div>
      </section>

      <section class="operation-list-container">
        <div class="operation-list-header">
          <h2>录制操作列表</h2>
          <button id="btnScrollToTop" class="btn btn-scroll-top" title="滚动到顶部" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>
        <div id="operationsList" class="operation-list">
          <div id="emptyState" class="empty-state">
            <p>暂无录制操作</p>
            <p class="empty-hint">点击“开始录制”后，侧边栏会持续记录当前浏览器页内的交互步骤。</p>
          </div>
        </div>
      </section>

      <div id="playbackIndicator" class="playback-indicator hidden">
        <span>回放进度</span>
        <span id="playbackStep">0/0</span>
      </div>

      <section class="actions">
        <button id="btnExport" class="btn btn-export" disabled>
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 4v10"></path>
              <path d="M8 10l4 4 4-4"></path>
              <path d="M5 20h14"></path>
            </svg>
          </span>
          <span>导出 JSON</span>
        </button>
        <div class="playback-controls">
          <button id="btnPlayback" class="btn btn-playback" disabled title="回放" type="button">
            <span class="btn-icon btn-icon-play">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 6l10 6-10 6z"></path>
              </svg>
            </span>
            <span class="btn-icon btn-icon-pause" style="display:none">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <rect x="7" y="5" width="4" height="14" rx="1"></rect>
                <rect x="13" y="5" width="4" height="14" rx="1"></rect>
              </svg>
            </span>
            <span class="btn-text">回放</span>
          </button>
          <button id="btnStepOver" class="btn btn-step" disabled type="button">
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6l8 6-8 6z"></path>
                <rect x="16" y="6" width="2" height="12" rx="1"></rect>
              </svg>
            </span>
            <span>单步</span>
          </button>
          <button id="btnStopPlayback" class="btn btn-stop-playback" disabled type="button">
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="2"></rect>
              </svg>
            </span>
            <span>停止</span>
          </button>
        </div>
      </section>
    </section>

    <div id="operationDetailModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>操作详情</h3>
          <button id="btnCloseModal" class="btn-close" type="button">×</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
        <div class="modal-footer">
          <button id="btnDeleteOperation" class="btn btn-danger-outline" type="button">
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M19 6l-1 14H6L5 6"></path>
                <path d="M10 11v5M14 11v5"></path>
              </svg>
            </span>
            <span>删除此操作</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
